spring.application.name=enterprise-ecommerce
server.port=8080

spring.datasource.url=jdbc:h2:mem:enterprise_ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=ORDER,USER,VALUE,YEAR,MONTH,DAY,GROUP,KEY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Spring Security (HTTP Basic) credentials
app.security.user.name=admin
app.security.user.password=admin123
app.security.user.role=ADMIN
